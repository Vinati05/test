apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gitops-nginx
  namespace: argocd

spec:
  project: default

  source:
    repoURL:https://github.com/Vinati05/test.git
    targetRevision: master
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
